name: Update Download Stats

on:
  schedule:
    # Runs at minute 0 of every hour (UTC).
    # NOTE: GitHub may delay scheduled runs by up to 60 min during high load.
    - cron: "0 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - run: python update_stats.py

      - name: Commit
        run: |
          git config user.name  github-actions
          git config user.email github-actions@github.com

          git add stats.json

          git diff --cached --quiet || \

          git commit -m "Update download stats"

          git push