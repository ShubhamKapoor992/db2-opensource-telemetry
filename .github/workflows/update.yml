name: Update Download Stats

on:
  schedule:
    # Runs at minute 0 of every hour (UTC).
    # NOTE: GitHub may delay scheduled runs by up to 60 min during high load.
    - cron: "0 * * * *"

  workflow_dispatch:

# Cancel any in-progress run for the same workflow so runs never pile up.
concurrency:
  group: update-stats
  cancel-in-progress: true

permissions:
  contents: write

jobs:

  update:

    runs-on: ubuntu-latest
    timeout-minutes: 20   # update_stats.py sleeps ~6 min total; kill if hung

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - run: python update_stats.py

      - name: Commit and push (rebase-safe)
        run: |
          git config user.name  github-actions
          git config user.email github-actions@github.com

          git add stats.json

          # Skip commit+push entirely if nothing changed
          git diff --cached --quiet && exit 0

          git commit -m "chore: update download stats [skip ci]"

          # Rebase onto remote main before pushing to avoid race-condition
          # failures when two scheduled runs overlap.
          git pull --rebase origin main
          git push origin main